# Interval for fetching data in seconds
fetch_interval = { secs = 60, nanos = 0 }

# Solana JSON-RPC endpoint. Use a private RPC for production — the public
# mainnet endpoint is heavily rate-limited.
rpc_url = "https://api.mainnet-beta.solana.com"

# Address and port to listen on
# listen_addr = "127.0.0.1:8080"
# For docker/k8s
listen_addr = "0.0.0.0:8080"

[[addresses]]
# List of bond or vote account addresses to monitor
name = "Your validator"
address = "bond_account_address_here"
